<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fila Operacional</title>
<style>
  :root {
    --bg:#09090b; --panel:#0c0c0e; --line:#27272a; --muted:#a1a1aa; --text:#fafafa;
    --emerald:#34d399; --emerald2:#10b981; --blue:#2563eb; --zinc800:#27272a; --zinc900:#18181b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  *::-webkit-scrollbar { width:8px; height:8px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb {
    background:#3f3f46; border-radius:999px; border:2px solid transparent; background-clip:padding-box;
  }
  *::-webkit-scrollbar-thumb:hover { background:#52525b; border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-corner { background:transparent; }
  .shell {
    height:100%; display:flex; flex-direction:column; overflow:hidden;
    background:rgba(9,9,11,.98); border:0;
  }
  .toolbar {
    display:flex; align-items:center; gap:6px; padding:5px 8px;
    background:#18181b; border-bottom:1px solid rgba(39,39,42,.8); flex-shrink:0;
  }
  .tabs {
    display:flex; gap:4px; flex:1; min-width:0; padding:0; background:transparent; border:0;
  }
  .tabs button {
    flex:1; height:28px; border-radius:8px; border:1px solid transparent; background:transparent;
    color:#a1a1aa; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
  }
  .tabs button svg { width:12px; height:12px; }
  .tabs button.on.contas {
    background:rgba(16,185,129,.15); border-color:rgba(16,185,129,.2); color:#34d399;
  }
  .tabs button.on.montante {
    background:rgba(37,99,235,.15); border-color:rgba(37,99,235,.25); color:#93c5fd;
  }
  .head-actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .icon-btn {
    width:28px; height:28px; border-radius:8px; border:1px solid #3f3f46;
    background:#27272a; color:#d4d4d8; display:grid; place-items:center; padding:0;
  }
  .icon-btn:hover { color:#fff; border-color:#52525b; }
  .icon-btn.on { border-color:rgba(52,211,153,.45); color:var(--emerald); background:rgba(16,185,129,.12); }
  .icon-btn.mute { color:#71717a; border-color:#27272a; }
  .body {
    flex:1; min-height:0; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px;
    scrollbar-width:thin; scrollbar-color:#3f3f46 transparent;
  }
  .body.flash { box-shadow:inset 0 0 0 1px rgba(52,211,153,.35); }
  #live-view, #config-view {
    display:flex; flex-direction:column; gap:8px; min-height:0;
  }
  .card {
    background:rgba(24,24,27,.55); border:1px solid rgba(39,39,42,.8); border-radius:12px; padding:8px;
  }
  .reset-card { padding:6px 8px; }
  .reset-row { display:flex; align-items:flex-start; gap:6px; }
  .reset-ico {
    width:18px; height:18px; border-radius:6px; background:#27272a; border:1px solid #3f3f46;
    display:grid; place-items:center; color:var(--emerald); flex-shrink:0;
  }
  .reset-title {
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#e4e4e7;
  }
  .badge {
    font-size:8px; font-family:ui-monospace, Consolas, monospace; font-weight:700;
    padding:1px 5px; border-radius:5px; background:rgba(16,185,129,.1); color:var(--emerald);
    border:1px solid rgba(16,185,129,.2);
  }
  .reset-sub {
    margin-top:1px; font-size:8px; color:#71717a; line-height:1.3;
  }
  .next-card {
    padding:10px; border-radius:12px; border:1px solid #27272a; background:rgba(24,24,27,.8);
  }
  .next-card.mine {
    border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.1); color:#6ee7b7;
  }
  .next-label {
    display:block; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#71717a; margin-bottom:4px;
  }
  .next-name-row {
    display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; color:#fff;
  }
  .next-name { font-size:15px; font-weight:900; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pos-badge {
    font-size:11px; font-family:ui-monospace, Consolas, monospace; font-weight:900; color:var(--emerald2);
    background:rgba(16,185,129,.05); border:1px solid rgba(16,185,129,.1); border-radius:7px; padding:1px 7px; flex-shrink:0;
  }
  .hint-line {
    display:flex; align-items:center; gap:6px; padding-top:5px; border-top:1px solid rgba(39,39,42,.5);
    font-size:10px; color:#71717a; font-style:italic;
  }
  .alert-box {
    padding:8px 10px; border-radius:10px; text-align:center; margin-bottom:8px;
    background:rgba(239,68,68,.2); border:1px solid rgba(239,68,68,.4);
  }
  .alert-box strong { display:block; color:#f87171; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  .alert-box span { display:block; margin-top:3px; color:#e4e4e7; font-size:11px; font-weight:700; font-family:ui-monospace, Consolas, monospace; }
  .btn-row { display:flex; gap:6px; }
  .btn {
    height:30px; padding:0 10px; border-radius:10px; border:1px solid #3f3f46; background:#27272a;
    font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:5px;
  }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.green { background:#059669; border-color:transparent; color:#fff; }
  .btn.emerald { background:#10b981; border-color:transparent; color:#09090b; }
  .btn.red { background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.3); color:#fca5a5; }
  .btn.full { width:100%; }
  .btn.join {
    width:100%; height:32px; border-radius:10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:900;
  }
  .btn.join.contas { background:#059669; border:1px solid rgba(16,185,129,.2); color:#fff; }
  .btn.join.montante { background:#2563eb; border:1px solid rgba(37,99,235,.25); color:#fff; }
  .me-card {
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding:8px 10px; border-radius:12px; border:1px solid rgba(39,39,42,.5); background:rgba(24,24,27,.5);
  }
  .me-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .dot { width:7px; height:7px; border-radius:50%; background:#71717a; flex-shrink:0; }
  .dot.on { background:#10b981; animation:pulse 1.2s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(16,185,129,.5); }
    70% { box-shadow:0 0 0 8px rgba(16,185,129,0); }
    100% { box-shadow:0 0 0 0 rgba(16,185,129,0); }
  }
  .me-left strong { display:block; font-size:11px; }
  .me-left em { display:block; margin-top:1px; font-style:normal; color:#71717a; font-size:9px; font-weight:700; }
  .me-btns { display:flex; gap:5px; flex-wrap:wrap; }
  .section-title {
    margin:2px 0 0; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#71717a;
  }
  .list { display:flex; flex-direction:column; gap:4px; }
  .row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 8px; border-radius:8px; border:1px solid #1f1f22; background:rgba(24,24,27,.35);
  }
  .row.first { border-color:rgba(16,185,129,.3); background:rgba(16,185,129,.05); }
  .row.paused { opacity:.4; }
  .row-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .pos {
    width:18px; height:18px; border-radius:5px; display:grid; place-items:center;
    font-size:9px; font-weight:900; font-family:ui-monospace, Consolas, monospace;
    border:1px solid #27272a; background:#09090b; color:#71717a; flex-shrink:0;
  }
  .row.first .pos { border-color:rgba(16,185,129,.2); background:rgba(16,185,129,.1); color:#34d399; }
  .name { font-size:11px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name.me { color:#34d399; }
  .name.paused { text-decoration:line-through; color:#52525b; }
  .tag {
    font-size:8px; font-weight:900; letter-spacing:.06em; text-transform:uppercase;
    padding:1px 5px; border-radius:5px; border:1px solid #27272a; background:#18181b; color:#71717a;
  }
  .tag.vez {
    color:#34d399; background:rgba(16,185,129,.15); border-color:rgba(16,185,129,.3); animation:pulse 1.4s ease-out infinite;
  }
  .empty {
    padding:8px 10px; border-radius:10px; border:1px solid #27272a; background:rgba(24,24,27,.3);
    display:flex; gap:8px; align-items:flex-start; color:#a1a1aa; font-size:11px;
  }
  .empty small { display:block; margin-top:2px; color:#52525b; font-size:9px; }
  .foot {
    flex-shrink:0; padding:6px 10px; border-top:1px solid #27272a;
    display:flex; justify-content:space-between; gap:8px;
    color:#52525b; font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  }
  .cfg-title {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding-bottom:6px; border-bottom:1px solid #27272a; margin-bottom:2px;
  }
  .cfg-title span { font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:#10b981; }
  .cfg-title button { border:0; background:transparent; color:#a1a1aa; font-size:10px; font-weight:700; cursor:pointer; }
  .cfg-box {
    background:rgba(24,24,27,.3); border:1px solid #18181b; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px;
  }
  .cfg-label {
    display:block; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#a1a1aa;
  }
  .cfg-box label.check {
    display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; color:#d4d4d8; cursor:pointer; user-select:none;
  }
  .cfg-box select, .cfg-box input[type="text"] {
    width:100%; height:38px; border-radius:12px; border:1px solid #18181b; background:#09090b;
    color:#fff; padding:0 12px; font-size:12px; outline:none;
  }
  .cfg-box input[type="range"] { width:100%; accent-color:#10b981; height:4px; cursor:pointer; }
  .cfg-sub { display:flex; gap:4px; background:rgba(24,24,27,.6); border:1px solid rgba(39,39,42,.5); border-radius:12px; padding:4px; }
  .cfg-sub button {
    flex:1; height:30px; border:0; border-radius:8px; background:transparent; color:#71717a;
    font-size:10px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
  }
  .cfg-sub button.on.contas { background:#27272a; color:#34d399; border:1px solid rgba(16,185,129,.1); }
  .cfg-sub button.on.montante { background:#27272a; color:#60a5fa; border:1px solid rgba(59,130,246,.15); }
  .vol-row { display:flex; justify-content:space-between; align-items:center; }
  .vol-row em { font-style:normal; font-family:ui-monospace, Consolas, monospace; font-size:12px; font-weight:700; color:#d4d4d8; }
  .interval-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .interval-grid button {
    height:30px; border-radius:8px; border:1px solid #18181b; background:#09090b; color:#a1a1aa;
    font-size:12px; font-family:ui-monospace, Consolas, monospace; font-weight:700;
  }
  .interval-grid button.on { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3); color:#34d399; }
  .drop {
    border:1px dashed #27272a; border-radius:12px; padding:14px; text-align:center; position:relative; cursor:pointer;
  }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop p { margin:0; font-size:11px; font-weight:700; color:#a1a1aa; }
  .drop small { display:block; margin-top:4px; font-size:9px; color:#71717a; }
  .hidden { display:none !important; }
  .toast {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    background:#18181b; border:1px solid #27272a; color:#e4e4e7; font-size:11px; font-weight:700;
    padding:8px 12px; border-radius:10px; z-index:20; pointer-events:none; opacity:0; transition:opacity .2s;
  }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <div class="tabs">
      <button type="button" class="contas on" data-sector="contas">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Contas
      </button>
      <button type="button" class="montante" data-sector="montante">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Montante
      </button>
    </div>
    <div class="head-actions">
      <button type="button" class="icon-btn on" id="btn-sound" title="Mutar notificações sonoras" aria-label="Som">
        <svg id="ico-vol-on" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <svg id="ico-vol-off" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-config" title="Configurações de Som do Alerta" aria-label="Configuração">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
    </div>
  </div>

  <div class="body" id="panel">
    <div id="live-view"></div>
    <div id="config-view" class="hidden"></div>
  </div>

  <div class="foot">
    <span>Realtime ativo</span>
    <span id="status">Sincronizando Fila</span>
  </div>
</div>
<audio id="alert-audio" preload="auto"></audio>
<div class="toast" id="toast"></div>
<script>
const defaultAlert = { soundType:'default', volume:0.6, repeat:true, interval:3000, startTime:0, endTime:20 };
const defaultSettings = { useSameConfig:true, contas:{...defaultAlert}, montante:{...defaultAlert} };

let sector = 'contas';
let state = null;
let busy = false;
let showConfig = false;
let configSubSector = 'contas';
let soundEnabled = localStorage.getItem('queueSoundEnabled') !== 'false';
let settings = loadLocalSettings();
let alertOn = false;
let alertSector = '';
let prevPos = { contas:null, montante:null };
let readyPos = { contas:false, montante:false };
let beepTimer = null;
let audioCtx = null;
let alertCache = { active:false, sector:'', stopped:false };
let lastFinger = '';
let toastTimer = null;
let configLoaded = false;

function loadLocalSettings() {
  try {
    const raw = localStorage.getItem('queueAlertSettings_app') || localStorage.getItem('queueAlertSettings_default');
    if (raw) return normalizeSettings(JSON.parse(raw));
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaultSettings));
}
function normalizeSettings(raw) {
  const base = JSON.parse(JSON.stringify(defaultSettings));
  if (!raw || typeof raw !== 'object') return base;
  base.useSameConfig = raw.useSameConfig !== false;
  base.contas = { ...defaultAlert, ...(raw.contas || {}) };
  base.montante = { ...defaultAlert, ...(raw.montante || {}) };
  return base;
}
function cacheKey() {
  const id = state && state.me && state.me.id ? String(state.me.id) : 'app';
  return 'queueAlertSettings_' + id;
}
function persistLocal() {
  try {
    localStorage.setItem(cacheKey(), JSON.stringify(settings));
    localStorage.setItem('queueAlertSettings_app', JSON.stringify(settings));
  } catch (e) {}
}
async function persistRemote() {
  persistLocal();
  try {
    await fetch('/fila/config', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ settings }),
    });
  } catch (e) {}
}
async function pullRemoteConfig() {
  try {
    const data = await fetch('/fila/config?ts=' + Date.now(), { cache:'no-store' }).then((r) => r.json());
    if (data && data.ok && data.settings) {
      settings = normalizeSettings(data.settings);
      persistLocal();
    } else if (data && data.meId) {
      try {
        const cached = localStorage.getItem('queueAlertSettings_' + data.meId);
        if (cached) settings = normalizeSettings(JSON.parse(cached));
      } catch (e) {}
    }
  } catch (e) {}
  configLoaded = true;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}
function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function sectorLabel(id) { return id === 'montante' ? 'Montante' : 'Contas'; }
function meIn(s) {
  if (!state) return null;
  return s === 'montante' ? state.meMontante : state.meContas;
}
function opsOf(s) {
  if (!state) return [];
  return s === 'montante' ? (state.montante || []) : (state.contas || []);
}
function activeSettingsFor(which) {
  if (settings.useSameConfig) return settings.contas;
  return which === 'montante' ? settings.montante : settings.contas;
}
function configTarget() {
  return settings.useSameConfig ? settings.contas : (configSubSector === 'montante' ? settings.montante : settings.contas);
}
function updateActiveField(field, value) {
  if (settings.useSameConfig) {
    settings.contas = { ...settings.contas, [field]: value };
    settings.montante = { ...settings.montante, [field]: value };
  } else if (configSubSector === 'montante') {
    settings.montante = { ...settings.montante, [field]: value };
  } else {
    settings.contas = { ...settings.contas, [field]: value };
  }
  persistRemote();
  paint();
}
function pad2(n) { return String(n).padStart(2, '0'); }
function formatSecondsToTime(secs) {
  if (isNaN(secs) || secs < 0) return '00:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return pad2(m) + ':' + pad2(s);
}
function parseTimeToSeconds(val) {
  if (!val) return 0;
  if (String(val).includes(':')) {
    const parts = String(val).split(':');
    if (parts.length === 2) return (parseInt(parts[0], 10) || 0) * 60 + (parseFloat(parts[1]) || 0);
  }
  return parseFloat(val) || 0;
}
function calculateNextReset(resetTime, now) {
  const parts = String(resetTime || '00:00').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  const target = new Date(now);
  target.setHours(h, m, 0, 0);
  if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
  return pad2(target.getDate()) + '/' + pad2(target.getMonth() + 1) + '/' + target.getFullYear() +
    ' às ' + pad2(target.getHours()) + ':' + pad2(target.getMinutes());
}
function getLastResetDisplay(resetTime, lastResetAt, lastResetType, now) {
  if (lastResetAt) {
    const d = new Date(lastResetAt);
    if (!isNaN(d.getTime())) {
      const typeLabel = lastResetType === 'manual' ? 'Manual' : 'Automático';
      return typeLabel + ' — ' + pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() +
        ' às ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
  }
  const parts = String(resetTime || '00:00').split(':');
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  const lastCycle = new Date(now);
  lastCycle.setHours(h, m, 0, 0);
  if (lastCycle.getTime() > now.getTime()) lastCycle.setDate(lastCycle.getDate() - 1);
  return 'Automático — ' + pad2(lastCycle.getDate()) + '/' + pad2(lastCycle.getMonth() + 1) + '/' + lastCycle.getFullYear() +
    ' às ' + pad2(lastCycle.getHours()) + ':' + pad2(lastCycle.getMinutes());
}
function fingerprint(data) {
  if (!data || !data.ok) return 'off';
  const pack = (ops) => (ops || []).map((op) => [op.userId, op.position, op.active === false ? 0 : 1, op.name].join(':')).join('|');
  return pack(data.contas) + '##' + pack(data.montante);
}
async function readFilaAlert() {
  try { alertCache = await fetch('/fila/alerta?ts=' + Date.now(), { cache:'no-store' }).then((r) => r.json()); } catch (e) {}
  return alertCache || { active:false, sector:'', stopped:false };
}
async function writeFilaAlert(data) {
  alertCache = data || { active:false, sector:'', stopped:false };
  try {
    await fetch('/fila/alerta', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(alertCache),
    });
  } catch (e) {}
}
function ensureAudio() {
  if (audioCtx) return audioCtx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  audioCtx = new Ctx();
  return audioCtx;
}
function isMuted() {
  return localStorage.getItem('queueSoundEnabled') === 'false';
}
function playCustomAlertSound(cfg) {
  if (isMuted()) return;
  const soundType = (cfg && cfg.soundType) || 'default';
  const volume = typeof (cfg && cfg.volume) === 'number' ? cfg.volume : 0.6;
  const audio = document.getElementById('alert-audio');

  if (soundType === 'custom' && cfg.customSoundUrl) {
    try {
      audio.pause();
      audio.volume = volume;
      audio.src = cfg.customSoundUrl;
      const start = cfg.startTime != null ? cfg.startTime : 0;
      const end = cfg.endTime != null ? cfg.endTime : 20;
      const onUpdate = () => {
        if (audio.currentTime >= end) {
          audio.pause();
          audio.removeEventListener('timeupdate', onUpdate);
        }
      };
      audio.onloadedmetadata = () => {
        audio.currentTime = start;
        audio.addEventListener('timeupdate', onUpdate);
        audio.play().catch(() => {});
      };
      if (audio.readyState >= 1) {
        audio.currentTime = start;
        audio.addEventListener('timeupdate', onUpdate);
        audio.play().catch(() => {});
      }
    } catch (e) {}
    return;
  }

  try {
    const ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    const tone = (type, freq, at, dur, peak) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      if (typeof freq === 'function') freq(osc, at);
      else osc.frequency.setValueAtTime(freq, at);
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(peak, at + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(at); osc.stop(at + dur + 0.02);
    };
    if (soundType === 'doorbell') {
      tone('sine', 587.33, now, 0.85, volume * 0.25);
      tone('sine', 440, now + 0.35, 1.0, volume * 0.25);
    } else if (soundType === 'digital') {
      [880, 880, 1046.5].forEach((f, i) => {
        const at = now + i * 0.12;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, at);
        gain.gain.setValueAtTime(0, at);
        gain.gain.linearRampToValueAtTime(volume * 0.08, at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(at); osc.stop(at + 0.1);
      });
    } else if (soundType === 'short') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume * 0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (soundType === 'siren') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.linearRampToValueAtTime(750, now + 0.25);
      osc.frequency.linearRampToValueAtTime(600, now + 0.5);
      osc.frequency.linearRampToValueAtTime(750, now + 0.75);
      osc.frequency.linearRampToValueAtTime(600, now + 1.0);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume * 0.12, now + 0.05);
      gain.gain.setValueAtTime(volume * 0.12, now + 0.9);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 1.1);
    } else {
      tone('sine', 659.25, now, 0.5, volume * 0.15);
      tone('sine', 987.77, now + 0.15, 0.6, volume * 0.18);
    }
  } catch (e) {}
}
function stopAlertAudio() {
  const audio = document.getElementById('alert-audio');
  try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch (e) {}
  if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
}
function startAlert(which) {
  alertOn = true;
  alertSector = which;
  writeFilaAlert({ active:true, sector:which || 'contas', stopped:false });
  restartAlertLoop();
  paint();
}
function restartAlertLoop() {
  stopAlertAudio();
  if (!alertOn || !alertSector) return;
  const cfg = activeSettingsFor(alertSector);
  ensureAudio();
  if (cfg.soundType === 'custom' && cfg.customSoundUrl) {
    playCustomAlertSound(cfg);
    return;
  }
  playCustomAlertSound(cfg);
  if (cfg.repeat) {
    beepTimer = setInterval(() => playCustomAlertSound(cfg), cfg.interval || 3000);
  }
}
async function stopAlert() {
  const stillFirst =
    (meIn('contas') && meIn('contas').active !== false && Number(meIn('contas').position) === 1) ||
    (meIn('montante') && meIn('montante').active !== false && Number(meIn('montante').position) === 1);
  alertOn = false;
  await writeFilaAlert({ active:!!stillFirst, sector:alertSector || sector, stopped:true });
  alertSector = '';
  stopAlertAudio();
  paint();
}
async function trackTurn() {
  if (!state || !state.me || !state.me.id) return;
  ['contas', 'montante'].forEach((s) => {
    const mine = meIn(s);
    const pos = mine && mine.active !== false ? Number(mine.position) || 0 : 0;
    const current = pos > 0 ? pos : null;
    if (!readyPos[s]) {
      prevPos[s] = current;
      readyPos[s] = true;
      return;
    }
    const before = prevPos[s];
    if (before !== current) {
      prevPos[s] = current;
      if (current === 1 && before !== 1 && mine && mine.active !== false) startAlert(s);
    }
  });
  const stillFirst =
    (meIn('contas') && meIn('contas').active !== false && Number(meIn('contas').position) === 1) ||
    (meIn('montante') && meIn('montante').active !== false && Number(meIn('montante').position) === 1);
  const saved = await readFilaAlert();
  if (!stillFirst) {
    if (alertOn) await stopAlert();
    await writeFilaAlert({ active:false, sector:'', stopped:false });
    return;
  }
  if (saved.stopped) {
    if (alertOn) {
      alertOn = false;
      stopAlertAudio();
      paint();
    }
    return;
  }
  if (saved.active && !saved.stopped && !alertOn) startAlert(saved.sector || sector);
}

function handleCustomUpload(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Arquivo maior que 5MB.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const url = String(reader.result || '');
    const audio = new Audio();
    audio.src = url;
    audio.onloadedmetadata = () => {
      const duration = audio.duration || 20;
      const patch = {
        soundType:'custom',
        customSoundUrl:url,
        customSoundName:file.name,
        customSoundDuration:duration,
        startTime:0,
        endTime:Math.min(duration, 20),
      };
      if (settings.useSameConfig) {
        settings.contas = { ...settings.contas, ...patch };
        settings.montante = { ...settings.montante, ...patch };
      } else if (configSubSector === 'montante') {
        settings.montante = { ...settings.montante, ...patch };
      } else {
        settings.contas = { ...settings.contas, ...patch };
      }
      persistRemote();
      toast('Arquivo carregado com sucesso');
      paint();
    };
  };
  reader.readAsDataURL(file);
}

async function refresh() {
  try {
    const data = await fetch('/fila/estado?ts=' + Date.now(), { cache:'no-store' }).then((r) => r.json());
    const finger = fingerprint(data);
    const changed = finger !== lastFinger && lastFinger !== '';
    lastFinger = finger;
    state = data;
    if (!configLoaded) await pullRemoteConfig();
    await trackTurn();
    paint();
    if (changed) {
      const panel = document.getElementById('panel');
      panel.classList.remove('flash');
      void panel.offsetWidth;
      panel.classList.add('flash');
      setTimeout(() => panel.classList.remove('flash'), 450);
    }
    document.getElementById('status').textContent = data && data.ok ? 'Sincronizando Fila' : ((data && data.message) || 'Sem sessão');
  } catch (e) {
    document.getElementById('status').textContent = 'Sem conexão';
  }
}
async function run(action) {

  try {
    ensureAudio();
    const res = await fetch('/fila/acao', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action, sector }),
    });
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error((json && json.message) || 'Não atualizei a fila.');
    state = json;
    lastFinger = fingerprint(json);
    await trackTurn();
    paint();
    document.getElementById('status').textContent = 'Sincronizando Fila';
  } catch (e) {
    document.getElementById('status').textContent = e.message || 'Falha ao sincronizar.';
    await refresh();
  } finally {
    busy = false;
    paint();
  }
}
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.addEventListener('click', () => {
    sector = btn.getAttribute('data-sector') || 'contas';
    document.querySelectorAll('.tabs button').forEach((el) => el.classList.toggle('on', el === btn));
    paint();
  });
});
document.getElementById('btn-sound').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('queueSoundEnabled', String(soundEnabled));
  toast(soundEnabled ? 'Som das notificações ativado!' : 'Som das notificações desativado!');
  paintSoundButton();
  if (!soundEnabled) stopAlertAudio();
});
document.getElementById('btn-config').addEventListener('click', () => {
  showConfig = !showConfig;
  paint();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
paint();
pullRemoteConfig().then(() => refresh());
setInterval(refresh, 1000);
</script>
</body>
</html>
